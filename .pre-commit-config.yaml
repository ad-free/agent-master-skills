repos:
-   repo: local
    hooks:
    - id: validate-skills
      name: validate skills
      entry: python tools/validate_skills.py
      language: system
      files: ^skills/|^agents/|^tools/validate_skills.py
    - id: validate-agents
      name: validate agents
      entry: python tools/validate_agents.py
      language: system
      files: ^agents/
    - id: run-pytest
      name: run pytest
      entry: python -m pytest -q
      language: system
      files: ^tests/|^tools/
