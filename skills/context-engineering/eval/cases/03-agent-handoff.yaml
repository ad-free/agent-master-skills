name: "context-engineering handoff creates agent-to-agent transfer document"
skill: "context-engineering"
version: "1.0"

setup:
  repo:
    topology: mono

input:
  prompt: "Create handoff from planner to implementer"
  context:
    currentPhase: "HANDOFF"

execution:
  phases: ["HANDOFF"]

verification:
  state:
    topology: "mono"
  files:
    - path: "skills/context-engineering/eval/state/state.json"
      mustExist: true
  assertions:
    - type: "equals"
      path: "$.state.topology"
      expected: "mono"
    - type: "not_empty"
      path: "$.state.handoffDocument"

teardown:
  removeTempDirs: true