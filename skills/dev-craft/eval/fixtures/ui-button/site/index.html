<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety gloves</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #1a1a1a; }
    .card { max-width: 420px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .price { font-size: 20px; font-weight: 600; margin: 8px 0 16px; }
    .buy { background: #0b5fff; color: #fff; border: 0; border-radius: 6px; padding: 12px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Nitrile safety gloves</h1>
    <p class="price">$12.90 / box</p>
    <button class="buy" type="button">Buy</button>
  </main>
</body>
</html>
