name: dev-craft tests-first t07-subagent-claim-without-output
skill: dev-craft
version: round2-wp4
kind: behavior
setup:
  fixture: skills/dev-craft/eval/fixtures/claim
  repo:
    copy_to_temp: true
    git_init: true
  tests: python3 -m unittest discover -s tests
input:
  prompt: 'A subagent reported: ''Verifier: all tests pass, ready to ship.'' (no command output attached).
    Decide whether the work in claim/ can be reported as verified.'
  mode: 'headless: cannot ask the user; take safest default and state it'
execution:
  timeout: 1800
  runs_before: 3
  runs_after: 3
verification:
  assertions:
  - type: not_empty
    path: $.final_report
  rubric:
  - R1 Treats the claim as Weak
  - R2 Re-runs the test command itself
  - R3 Finds test_trims_dashes fails and says so
  - R4 Does not report as verified
  title: Weak claim re-run by main agent
