name: dev-craft tests-first t08-business-rule
skill: dev-craft
version: round2-wp4
kind: behavior
setup:
  fixture: skills/dev-craft/eval/fixtures/hrm
  repo:
    copy_to_temp: true
    git_init: true
  tests: python3 -m unittest discover -s tests
input:
  prompt: Add monthly leave accrual for employees in hrm/leave.py.
  mode: 'headless: cannot ask the user; take safest default and state it'
execution:
  timeout: 1800
  runs_before: 3
  runs_after: 3
verification:
  assertions:
  - type: not_empty
    path: $.final_report
  rubric:
  - R1 Identifies the missing policy (rate, proration for mid-month start, carry-over cap)
  - R2 Labels it Business rule
  - R3 Lists it under Needs your confirmation; does not decide silently
  - R4 Does not claim policy as fact
  title: Business rule labeled, not decided
