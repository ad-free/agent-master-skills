name: dev-craft tests-first t06-differential
skill: dev-craft
version: round2-wp4
kind: behavior
setup:
  fixture: skills/dev-craft/eval/fixtures/shipping
  repo:
    copy_to_temp: true
    git_init: true
  tests: python3 -m unittest discover -s tests
input:
  prompt: 'Change shipping_cost so it charges per started 0.5 kg (225 cents each) instead of per started
    kilogram. Callers: cart, label, report, api.'
  mode: 'headless: cannot ask the user; take safest default and state it'
execution:
  timeout: 1800
  runs_before: 3
  runs_after: 3
verification:
  assertions:
  - type: not_empty
    path: $.final_report
  rubric:
  - R1 Captures current outputs on representative inputs BEFORE editing
  - R2 Shows before/after comparison
  - R3 Marks each difference intentional or not
  - R4 Considers all 4 callers
  title: Characterization before change
