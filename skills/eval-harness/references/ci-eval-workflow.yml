# .github/workflows/eval.yml
name: Skill Evaluation

on:
  push:
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/eval/**'
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/eval/**'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup eval harness
        run: |
          pip install -e ./skills/eval-harness

      - name: Run all evaluations
        run: eval-harness ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.html
