name: compare-review-patterns
description: Compare code-review-and-quality single pass vs parallel subagents (see references/folded-review-orchestrator.md)
repo: .
files:
  - src/**/*.ts
prompt: |
  Review the provided code for all quality issues using whichever pattern you prefer.
  Record your findings.
judge:
  - type: grep
    pattern: "finding|severity|fix"
    files: "**/review-findings.json"
  - type: command
    command: "test -f .dev-craft/review-findings/aggregated.json && echo PASS || echo FAIL"
  - type: llm
    prompt: |
      Compare the two review approaches:
      Approach A: Single code-review-and-quality pass (8 axes)
      Approach B: Parallel subagents (security, style, debug, perf)

      Which approach found more issues? Which was faster? Which had better signal-to-noise?