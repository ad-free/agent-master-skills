name: Agents CI

on:
  push:
    paths:
      - 'agents/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'agents/**'
      - 'tools/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest

      - name: Validate skill files (frontmatter & safety)
        run: |
          python tools/validate_skills.py
          # quick grep for high-confidence secret tokens in skill docs
          grep -RIn "AWS_ACCESS_KEY_ID\|AWS_SECRET_ACCESS_KEY\|-----BEGIN PRIVATE KEY-----\|API_KEY\|SECRET_KEY" skills || true

      - name: Validate agent files
        run: python tools/validate_agents.py

      - name: Validate eval cases
        run: python tools/validate_eval_cases.py

      - name: Run tests
        run: pytest -q
      - name: Optional dev-craft state validation
        env:
          DEV_CRAFT_PROJECT_PATH: ${{ secrets.DEV_CRAFT_PROJECT_PATH }}
        run: |
          if [ -n "$DEV_CRAFT_PROJECT_PATH" ]; then
            python tools/validate_dev_craft_state.py "$DEV_CRAFT_PROJECT_PATH" || exit 1
          else
            echo "DEV_CRAFT_PROJECT_PATH not set — skipping dev-craft validation"
          fi
