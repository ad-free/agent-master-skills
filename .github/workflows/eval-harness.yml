name: Eval Harness CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml || true

      - name: List eval cases
        run: python tools/eval_harness.py list

      - name: Run deterministic evals
        run: |
          python tools/eval_harness.py ci
          cat eval-results.json

      - name: Run pass@k trials (only for cases with pass_at_k: true)
        run: |
          # Check if any cases require pass@k trials
          if grep -q "pass_at_k: true" skills/*/eval/cases/*.yaml 2>/dev/null; then
            python tools/eval_harness.py ci --trials 3
            cat eval-results.json
          else
            echo "No pass@k cases found, skipping trials"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json