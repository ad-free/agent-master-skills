name: Skill Eval Harness

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/eval/**'
      - 'skills/eval-harness/**'
      - 'skills/agent-eval/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/eval/**'
      - 'skills/eval-harness/**'
      - 'skills/agent-eval/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate-schema:
    name: Validate test case schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install pyyaml jsonschema
      - name: Validate eval test cases against schema
        run: |
          python tools/validate_eval_cases.py

  run-evals:
    name: Run skill evals
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install pyyaml
      - name: Run eval harness (CI mode)
        run: |
          python tools/eval_harness.py ci
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval-report.html
            eval-results.json

  validate-agents:
    name: Validate agents & skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install pyyaml pytest
      - name: Validate skills
        run: python tools/validate_skills.py
      - name: Validate agents
        run: python tools/validate_agents.py
      - name: Run tests
        run: pytest -q
